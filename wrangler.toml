name = "mix-bot"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Раз в неделю, понедельник 06:00–10:50 МСК: каждые 10 минут обновляется один бренд из BRANDS по порядку
# (30 запусков — хватает на 30 брендов).
[triggers]
crons = ["*/10 3-7 * * 1"]

# Бесплатные модели Cloudflare
[ai]
binding = "AI"

# Хранилище: справочник табаков и диалоги.
# Создать: Storage & Databases → KV → Create → имя mix-bot, вставить ID сюда.
[[kv_namespaces]]
binding = "KV"
id = "feb60298be7e4467a50ee0c889bafdc6"

[vars]
# ── Мозги. Чтобы сменить модель, меняются только эти строки ──
# cloudflare — бесплатно, ключ не нужен
# anthropic  — Claude, нужен секрет LLM_API_KEY          (LLM_MODEL = "claude-sonnet-5-5")
# openai     — OpenAI и совместимые, нужен LLM_API_KEY   (LLM_MODEL = "gpt-...", при необходимости LLM_BASE_URL)
LLM_PROVIDER = "cloudflare"
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
LLM_BASE_URL = ""

# Бренды, из которых бот собирает миксы (только наши). Через запятую, как в адресе htreviews.org/tobaccos/<бренд>.
# Добавить бренд: дописать сюда → Commit → открыть /refresh?key=... Не больше 30.
# deus — Deus, khuligan — Хулиган, spectrum — Spectrum, kraken — Kraken, satyr — Satyr,
# original-virginia — Original Virginia, morpheus — Morpheus
BRANDS = "deus,khuligan,spectrum,kraken,satyr,original-virginia,morpheus"

# Картинка к главному миксу: on / off
IMAGES = "on"
# FLUX.2 klein 4B — ~100 «нейронов» за картинку. Запасной вариант: "@cf/black-forest-labs/flux-1-schnell" (проще, без текста).
IMAGE_MODEL = "@cf/black-forest-labs/flux-2-klein-4b"
# Текст на картинке: full — SIGMA MIX + подписи с долями; logo — только SIGMA MIX; none — без текста.
IMAGE_TEXT = "full"

SHOP_URL = "https://vektorsigma.am"

# Секреты (Settings → Variables and Secrets, тип Secret):
#   BOT_TOKEN       — токен бота от @BotFather
#   WEBHOOK_SECRET  — случайная строка (латиница и цифры)
#   LLM_API_KEY     — только если LLM_PROVIDER не cloudflare
